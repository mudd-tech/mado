<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><title>Mado♥️</title><meta name="description" content="Mado♥️"><meta property="og:title" content="Mado♥️"><meta property="og:type" content="website"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#08090d;--cd:#13161f;--cd2:#1a1e2b;--tx:#f5f6fa;--mu:#9aa3b5;--bd:rgba(255,255,255,.09);--sh:0 12px 30px rgba(0,0,0,.48);--gl:rgba(22,26,37,.72)}:root[data-theme=dark]{--bg:#08090d;--cd:#13161f;--cd2:#1a1e2b;--tx:#f5f6fa;--mu:#9aa3b5;--bd:rgba(255,255,255,.09);--sh:0 12px 30px rgba(0,0,0,.48);--gl:rgba(22,26,37,.72)}:root[data-theme=light]{--bg:#f4f5f9;--cd:#ffffff;--cd2:#f8f9fc;--tx:#12151e;--mu:#626a7a;--bd:rgba(15,23,42,.08);--sh:0 10px 28px rgba(15,23,42,.07);--gl:rgba(255,255,255,.78)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,#6ee7b72a,transparent 55%),var(--bg);
  color:var(--tx);
  font-family:"Tajawal","Cairo",Tahoma,system-ui,sans-serif;
  display:flex;justify-content:center;
}
.w{width:100%;max-width:440px;text-align:center;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));position:relative}
.tg{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:8;
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--bd);background:var(--gl);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--tx);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--sh);padding:0;

.cv{height:195px;background:radial-gradient(circle at 50% 25%,#6ee7b755,transparent 70%),linear-gradient(135deg,#6ee7b738,#6ee7b70d);position:relative;overflow:hidden}

.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 0%,transparent 35%,var(--bg) 98%)}

.lg{
  width:112px;height:112px;
  margin:-58px auto 14px;
  position:relative;z-index:2;border-radius:50%;
  border:3px solid #6ee7b7;
  box-shadow:0 0 0 5px var(--bg),0 14px 34px #6ee7b755;
  display:flex;align-items:center;justify-content:center;
  font-size:2.7rem;font-weight:800;color:#6ee7b7;background:var(--cd);overflow:hidden;
}
.lg img{width:100%;height:100%;object-fit:cover}

.title-row{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 16px;max-width:100%}
h1{margin:0;font-size:1.62rem;font-weight:800;letter-spacing:-.2px}
.ver{
  width:22px;height:22px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#6ee7b7,#6ee7b7cc);color:#111;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px #6ee7b755;
}
.tagline{margin:6px 22px 14px;color:var(--mu);font-size:.9rem;line-height:1.55}
.divider{
  width:64px;height:2px;margin:0 auto 20px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#6ee7b7,transparent);
}

.bs{padding:0 18px;display:grid;gap:12px;grid-template-columns:1fr}
.b{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:13px 15px;
  border-radius:10px;
  color:var(--tx);text-decoration:none;font:inherit;cursor:pointer;text-align:right;
  position:relative;overflow:hidden;
  transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease;

.b:hover{border-color:#6ee7b788}
.b:active{transform:scale(.982)}
.b{background:transparent;box-shadow:none;border:1.8px solid #6ee7b7}

.b i{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}

.b b{font-size:.94rem;font-weight:700}

.b code{font-family:ui-monospace,Consolas,monospace;font-size:.98rem;letter-spacing:.5px;direction:ltr;text-align:right;color:#6ee7b7;font-weight:700}

.cb{width:auto;border:0;border-radius:11px;padding:8px 14px;background:linear-gradient(135deg,#6ee7b7,#6ee7b7cc);color:#111;font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}
.wc{cursor:default}



.pri{background:linear-gradient(135deg,#6ee7b7,#6ee7b7cc)!important;color:#111!important;border:0!important;box-shadow:0 10px 26px #6ee7b744!important}

.soc-sec{margin:24px 18px 6px}
.soc-hd{display:flex;align-items:center;gap:10px;margin-bottom:13px;color:var(--mu);font-size:.78rem;font-weight:700}
.soc-hd::before,.soc-hd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bd),transparent)}

.sc{text-decoration:none;color:var(--tx);transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease}
.sc:active{transform:scale(.97)}

.soc-pills .sc-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 15px;border-radius:999px;
  background:var(--cd);border:1px solid #6ee7b744;

.soc-pills .sc-pill:hover{border-color:#6ee7b7;transform:translateY(-2px)}

/* Style B: 2-Column Mini Cards */
.soc-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.sc-card{
  display:flex;align-items:center;gap:10px;

  background:var(--cd);border:1px solid var(--bd);box-shadow:var(--sh);

.sc-card span{min-width:0;display:flex;flex-direction:column;gap:1px}
.sc-card b{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-card small{font-size:.7rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-card:last-child:nth-child(odd){grid-column:1/-1}

/* Style C: Official Brand Colors */
.soc-brand .sc-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:999px;
  color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.22);

.soc-brand .sc-pill:hover{transform:translateY(-2px);filter:brightness(1.06)}
.soc-brand .br-fb{background:#1877F2}
.soc-brand .br-ig{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.soc-brand .br-tt{background:#111111;box-shadow:-2px -2px 0 #25F4EE,2px 2px 0 #FE2C55,0 6px 16px rgba(0,0,0,.3)}
.soc-brand .br-yt{background:#FF0000}
.soc-brand .br-tg{background:#26A5E4}
.soc-brand .br-x{background:#0f1419;border:1px solid rgba(255,255,255,.18)}
.soc-brand .br-snap{background:#FFFC00;color:#111111}
.soc-brand .br-globe{background:linear-gradient(135deg,#6ee7b7,#6ee7b7bb);color:#111111}

/* Style D: Squircle Icon Dock */
.soc-dock{gap:12px}
.sc-dock{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:68px;
}
.sc-dock i{
  width:52px;height:52px;border-radius:16px;
  background:linear-gradient(180deg,var(--cd2),var(--cd));
  border:1px solid #6ee7b755;color:#6ee7b7;
  box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s,background .2s,color .2s;
}
.sc-dock:hover i{transform:translateY(-3px);background:#6ee7b7;color:#111}
.sc-dock span{font-size:.71rem;font-weight:700;color:var(--mu);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ad{
  display:inline-block;margin-top:16px;padding:9px 20px;border-radius:999px;
  border:1px solid #6ee7b755;background:var(--cd);color:var(--tx);
