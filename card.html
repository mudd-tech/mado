    .nfc-card{
      flex:none;
      width:8.56cm;
      height:5.4cm;
      background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.75),transparent 50%),linear-gradient(135deg,#f7ebd2 0%,#e6cf9c 52%,#d6b877 100%);color:#241b0c;border:0.076cm solid #8c6a24;
      font-family:"Cairo",Tahoma,Arial,sans-serif;
      border-radius:0.243cm;
      padding:0.351cm;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      box-sizing:border-box;
    }
    .nfc-card *{box-sizing:border-box}
    .nfc-card::before{
      content:"";position:absolute;inset:0.119cm;
      border-radius:0.173cm;
      border:1px solid rgba(0,0,0,.07);
      pointer-events:none;
    }
    .c-top{display:flex;align-items:center;justify-content:space-between;gap:0.162cm;z-index:1}
    .nfc-pill{
      display:inline-flex;align-items:center;gap:0.076cm;
      padding:0.065cm 0.151cm;
      border-radius:999px;
      border:1px solid #6e501466;
      background:rgba(0,0,0,.04);
      color:#6e5014;
      font-size:0.184cm;font-weight:800;letter-spacing:.6px;
    }
    .nfc-pill svg{width:0.281cm;height:0.281cm}
    .chip{
      width:0.594cm;height:0.443cm;
      border-radius:0.086cm;
      border:1px solid #6e501477;
      background:linear-gradient(135deg,#6e501444,#6e501411);
      position:relative;
    }
    .c-mid{
      display:flex;
      flex-direction:row;
      align-items:center;
      justify-content:flex-start;
      text-align:right;
      gap:0.259cm;
      z-index:1;
      margin:auto 0;
    }
    .clogo{
      width:1.836cm;height:1.836cm;
      border-radius:50%;
      object-fit:cover;
      background:#fff;
      border:0.054cm solid #6e5014;
      flex:none;
      box-shadow:0 0.081cm 0.243cm rgba(0,0,0,.28);
    }
    .cini{
      display:grid;place-items:center;
      font-size:0.845cm;font-weight:800;
      color:#d4af37;background:#fff;
    }
    .cinfo{min-width:0;flex:1}
    .cname{font-size:0.443cm;font-weight:800;line-height:1.25;margin:0}
    .ctag{font-size:0.227cm;opacity:.82;margin:0.054cm 0 0}
    .crole{
      display:inline-block;margin-top:0.119cm;
      font-size:0.205cm;font-weight:700;color:#6e5014;
    }
    .c-bot{
      display:flex;align-items:flex-end;justify-content:space-between;gap:0.162cm;
      z-index:1;font-size:0.194cm;opacity:.88;
    }
    .cphone{font-weight:700;letter-spacing:.4px}
    .cbrand{font-size:0.162cm;opacity:.65;letter-spacing:1px;font-weight:700}
    .mini-qr{
      width:1.296cm;height:1.296cm;
      background:#fff;padding:0.043cm;border-radius:0.097cm;
      flex:none;overflow:hidden;
    }
    /* Back Side */
    .back-body{
      flex:1;display:flex;
      flex-direction:row;
      align-items:center;justify-content:center;
      gap:0.351cm;
      text-align:right;
      z-index:1;
    }
    .qr-box{
      width:2.592cm;height:2.592cm;
      background:#fff;
      padding:0.097cm;
      border-radius:0.162cm;
      border:0.054cm solid #6e5014;
      display:grid;place-items:center;
      flex:none;overflow:hidden;
      box-shadow:0 0.108cm 0.270cm rgba(0,0,0,.25);
    }
    .qph{font-size:0.162cm;color:#444;text-align:center;padding:4px}
    .back-txt{display:flex;flex-direction:column;gap:0.097cm;align-items:flex-start}
    .bhint{font-size:0.281cm;font-weight:800;line-height:1.35;margin:0}
    .bsub{font-size:0.205cm;opacity:.82;margin:0}
    .curl{
      font-size:0.184cm;font-weight:700;color:#6e5014;
      background:rgba(0,0,0,.05);
      padding:0.054cm 0.140cm;border-radius:999px;
      max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
  
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      background:#e5e7eb;
      font-family:"Cairo",Tahoma,sans-serif;
      display:flex;flex-direction:column;align-items:center;
      gap:16px;padding:18px 12px;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .sheet-lbl{font-size:12px;font-weight:700;color:#4b5563;margin-bottom:-8px}
    .card-wrap{position:relative;display:inline-block}
    .has-crop::before,.has-crop::after{
      content:"";position:absolute;inset:-4mm;pointer-events:none;
      border:1px dashed rgba(0,0,0,.28);
    }
    .nfc-card{box-shadow:0 12px 30px rgba(0,0,0,.18)}
    .pb{
      position:fixed;top:12px;left:12px;z-index:10;
      padding:9px 16px;border:0;border-radius:10px;
      background:#111827;color:#fff;font:inherit;font-weight:700;cursor:pointer;
    }
    @media print{
      body{background:#fff;padding:10mm;gap:12mm}
      .pb,.sheet-lbl{display:none}
      .nfc-card{box-shadow:none;break-inside:avoid}
    }
